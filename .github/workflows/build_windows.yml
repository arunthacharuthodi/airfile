name: Build Windows Installer (AirFile-Setup-x64.exe)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & Package Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop Support
        run: flutter config --enable-windows-desktop

      - name: Install Inno Setup Compiler
        run: choco install innosetup --no-progress -y

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Flutter Windows Application (Release)
        run: flutter build windows --release

      - name: Verify Build Artifacts
        shell: pwsh
        run: |
          if (Test-Path "build\windows\x64\runner\Release\AirFile.exe") {
            Write-Host "AirFile.exe compiled successfully!" -ForegroundColor Green
          } else {
            Write-Error "AirFile.exe was not found in Release output."
            exit 1
          }

      - name: Compile Inno Setup Installer (AirFile-Setup-x64.exe)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = (Get-Command iscc).Source
          }
          & $iscc "windows\installer\inno_setup.iss"

      - name: Verify Installer Binary
        shell: pwsh
        run: |
          $installerPath = "build\windows\installer\AirFile-Setup-x64.exe"
          if (Test-Path $installerPath) {
            $size = (Get-Item $installerPath).Length / 1MB
            Write-Host "AirFile-Setup-x64.exe generated successfully! Size: $([math]::Round($size, 2)) MB" -ForegroundColor Green
          } else {
            Write-Error "AirFile-Setup-x64.exe was not created."
            exit 1
          }

      - name: Upload Windows Installer as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirFile-Windows-Setup
          path: build\windows\installer\AirFile-Setup-x64.exe
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build\windows\installer\AirFile-Setup-x64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
